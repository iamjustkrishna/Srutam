<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
<defs>
  <filter id="boil" x="-2%" y="-2%" width="104%" height="104%">
    <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="3"/>
    <feDisplacementMap in="SourceGraphic" scale="2.2" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="8"/><feColorMatrix values="0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.55  0 0 0 0.09 0"/></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
  <radialGradient id="lamp" cx="757" cy="40" r="520" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#EAF1FF" stop-opacity=".55"/><stop offset=".45" stop-color="#C9D4EA" stop-opacity=".18"/><stop offset="1" stop-color="#C9D4EA" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="shadeL" x1="0" x2="1"><stop offset="0" stop-color="#2E3550" stop-opacity=".55"/><stop offset=".45" stop-color="#2E3550" stop-opacity="0"/></linearGradient>
  <linearGradient id="hoodie" x1="0" y1="0" x2=".4" y2="1"><stop offset="0" stop-color="#D15B43"/><stop offset="1" stop-color="#B4452F"/></linearGradient>
  <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D5A56C"/><stop offset="1" stop-color="#B98650"/></linearGradient>
  <linearGradient id="ceil" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7C88A2"/><stop offset="1" stop-color="#A3AEC4"/></linearGradient>
</defs>

