<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
<defs>
  <filter id="boil" x="-2%" y="-2%" width="104%" height="104%">
    <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="5"/>
    <feDisplacementMap in="SourceGraphic" scale="3" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="8"/><feColorMatrix values="0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.55  0 0 0 0.09 0"/></filter>
  <filter id="blur"><feGaussianBlur stdDeviation="14"/></filter>
  <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6F7C99"/><stop offset=".55" stop-color="#94A0BA"/><stop offset="1" stop-color="#7F8BA6"/></linearGradient>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1E2B52"/><stop offset="1" stop-color="#40558A"/></linearGradient>
  <linearGradient id="tee" x1="0" y1="0" x2=".3" y2="1"><stop offset="0" stop-color="#E7AB42"/><stop offset="1" stop-color="#C78727"/></linearGradient>
  <linearGradient id="quilt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A05E7E"/><stop offset="1" stop-color="#7A4462"/></linearGradient>
  <radialGradient id="phoneGlow" cx="540" cy="880" r="420" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#BFE6FF" stop-opacity=".55"/><stop offset=".4" stop-color="#9CCBF2" stop-opacity=".2"/><stop offset="1" stop-color="#9CCBF2" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="vig" cx="540" cy="960" r="1150" gradientUnits="userSpaceOnUse">
    <stop offset=".55" stop-color="#141A30" stop-opacity="0"/><stop offset="1" stop-color="#141A30" stop-opacity=".6"/>
  </radialGradient>
  <pattern id="print" width="64" height="64" patternUnits="userSpaceOnUse" patternTransform="rotate(-6)">
    <circle cx="16" cy="16" r="7" fill="none" stroke="#D69AB2" stroke-width="2.4"/>
    <circle cx="16" cy="16" r="2" fill="#D69AB2"/>
    <path d="M48 40 l8 8 l-8 8 l-8 -8z" fill="#C47E9C"/>
  </pattern>
</defs>

