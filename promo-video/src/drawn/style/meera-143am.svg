  <radialGradient id="vig" cx="540" cy="960" r="1150" gradientUnits="userSpaceOnUse">
    <stop offset=".55" stop-color="#141A30" stop-opacity="0"/><stop offset="1" stop-color="#141A30" stop-opacity=".6"/>
  </radialGradient>
  <pattern id="print" width="64" height="64" patternUnits="userSpaceOnUse" patternTransform="rotate(-6)">
    <circle cx="16" cy="16" r="7" fill="none" stroke="#D69AB2" stroke-width="2.4"/>
    <circle cx="16" cy="16" r="2" fill="#D69AB2"/>
    <path d="M48 40 l8 8 l-8 8 l-8 -8z" fill="#C47E9C"/>
  </pattern>
</defs>

