  <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="8"/><feColorMatrix values="0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.55  0 0 0 0.09 0"/></filter>
  <filter id="blur"><feGaussianBlur stdDeviation="14"/></filter>
  <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6F7C99"/><stop offset=".55" stop-color="#94A0BA"/><stop offset="1" stop-color="#7F8BA6"/></linearGradient>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1E2B52"/><stop offset="1" stop-color="#40558A"/></linearGradient>
  <linearGradient id="tee" x1="0" y1="0" x2=".3" y2="1"><stop offset="0" stop-color="#E7AB42"/><stop offset="1" stop-color="#C78727"/></linearGradient>
  <linearGradient id="quilt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A05E7E"/><stop offset="1" stop-color="#7A4462"/></linearGradient>
  <radialGradient id="phoneGlow" cx="760" cy="1030" r="560" gradientUnits="userSpaceOnUse">
